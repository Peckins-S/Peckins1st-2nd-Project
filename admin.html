<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101612">
    <meta name="description" content="Admin sign-in for 90+minutes.">
    <title>Admin sign in — 90+minutes</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=2">
    <link rel="shortcut icon" href="favicon.ico?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
    <link rel="stylesheet" href="style.css">
    <script src="supabase-config.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="admin-login.js" defer></script>
  </head>
  <body class="admin-page">
    <header class="topbar admin-topbar">
      <a class="brand" href="index.html" aria-label="90+minutes home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" role="presentation">
            <circle cx="20" cy="20" r="18" fill="#8be28a" stroke="#d8f5d5" stroke-width="1.5"/>
            <path d="m20 4 5 3.7-1.9 5.8h-6.2L15 7.7 20 4Zm-14 10 5.8.6 2.4 5.8-4.3 4.3-5-2.5L4 18l2-4Zm28 0 2 4-.9 4.2-5 2.5-4.3-4.3 2.4-5.8 5.8-.6ZM12 31l5-2.3 3 3.1-1.2 4.1-5.3-.6L12 31Zm16 0-1.5 4.3-5.3.6-1.2-4.1 3-3.1 5 2.3Z" fill="#18351d" opacity=".88"/>
            <text x="20" y="23" fill="#f2fff0" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">90</text>
          </svg>
        </span>
        <span>90+minutes</span>
      </a>
      <a class="admin-back-link" href="index.html">← View site</a>
    </header>

    <main class="admin-shell">
      <div class="admin-heading">
        <p class="section-kicker">90+MINUTES / CONTROL ROOM</p>
        <h1>Admin sign in</h1>
        <p>Sign in with the authorized admin account to continue.</p>
      </div>
      <div class="admin-notice" id="login-notice" role="status" aria-live="polite" hidden></div>
      <section class="admin-card admin-login" id="admin-login">
        <form id="login-form">
          <label class="admin-field">
            <span>Email</span>
            <input id="login-email" type="email" autocomplete="username" placeholder="your-email@example.com" required>
          </label>
          <label class="admin-field">
            <span>Password</span>
            <input id="login-password" type="password" autocomplete="current-password" required>
          </label>
          <button class="admin-primary-button" id="login-button" type="submit">Sign in</button>
          <button class="admin-reset-link" id="reset-request" type="button">Forgot password?</button>
        </form>
      </section>
      <section class="admin-card admin-login" id="password-reset" hidden>
        <h2>Set your admin password</h2>
        <p>Choose a password with at least 8 characters.</p>
        <form id="password-reset-form">
          <label class="admin-field">
            <span>New password</span>
            <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <label class="admin-field">
            <span>Confirm new password</span>
            <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <button class="admin-primary-button" id="password-reset-button" type="submit">Set password</button>
        </form>
      </section>
    </main>
  </body>
</html>
